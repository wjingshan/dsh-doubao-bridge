# Doubao (豆包) desktop bridge — MCP server + Web UI badge, one bundle.
#
# Prerequisite: the Doubao PC app must run once with
#   --remote-debugging-port=9225 --remote-debugging-address=127.0.0.1
# Run tools/start-doubao-cdp.ps1 to do that. When Doubao is closed the tools
# only report a connection error; failOnStartupError:false keeps the harness
# booting anyway.
#
# `command: node` resolves through PATH, and the MCP client runs servers with
# the profile directory as cwd (verified), so the script path below stays
# relative and the bundle is portable across machines.
- insert:
    - id: doubao-bridge-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: doubao
        transport: stdio
        command: 'node'
        args:
          - 'node_modules/dsh-doubao-bridge/server.mjs'
          - '--mcp'
        env:
          DOUBAO_REVISION: '2'
        # A task-mode handoff routinely takes minutes; give it room.
        toolCallTimeoutMs: 900000
        failOnStartupError: false

    # Shows "DeepSeek 在执行 / 豆包正在执行 / 豆包已接管，待收回" under the composer.
    - id: doubao-bridge-badge
      name: 'dsh-doubao-bridge'
